<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>En vivo — Letra sincronizada</title>
<style>
  :root{
    --ink:#f3f4ef;
    --muted:rgba(243,244,239,0.6);
    --accent:#1db954;
    --line-dim:rgba(255,255,255,0.4);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    position:relative;
    background:#0b0b0d;
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    overflow-x:hidden;
  }
  @font-face{ font-family:'Fraunces'; src:local('Georgia'); }

  /* ambient blurred backdrop, drawn from the current track's artwork */
  .bg-blur{
    position:fixed; inset:-10%;
    background-position:center; background-size:cover;
    filter:blur(90px) saturate(1.6);
    opacity:0.85;
    transition:background-image .6s ease;
    z-index:-2;
  }
  .bg-tint{
    position:fixed; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0.1), rgba(0,0,0,0.5));
    z-index:-1;
  }

  .glass{
    backdrop-filter:blur(32px) saturate(180%);
    -webkit-backdrop-filter:blur(32px) saturate(180%);
    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.22);
    box-shadow:0 20px 50px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.25);
  }

  /* ---------- login screen ---------- */
  .login-wrap{
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
  }
  .login{
    text-align:center;
    padding:64px 32px;
    border-radius:24px;
    width:100%;
    max-width:520px;
  }
  .login h1{
    font-family:var(--font-display);
    font-weight:500;
    font-size:2rem;
    margin:0 0 12px;
    letter-spacing:-0.01em;
  }
  .login p{
    color:var(--muted);
    max-width:40ch;
    margin:0 auto 32px;
    line-height:1.5;
  }
  button{
    font-family:var(--font-body);
    font-size:0.95rem;
    font-weight:600;
    border:none;
    border-radius:999px;
    padding:14px 32px;
    background:var(--accent);
    color:#06210f;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  button:hover{background:#21e362; transform:translateY(-1px);}
  button:focus-visible{outline:2px solid var(--ink); outline-offset:3px;}
  .error{ color:#ff8a7a; margin-top:18px; font-size:0.9rem; }

  /* ---------- player screen: full-bleed, split 50/50 ---------- */
  .player{display:none;}
  .player.active{
    display:flex;
    flex-wrap:wrap;
    position:fixed;
    inset:0;
    z-index:5;
  }

  .now-playing{
    flex:1 1 50%;
    min-width:320px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:48px;
    position:relative;
  }
  .now-playing::after{
    content:'';
    position:absolute; top:12%; bottom:12%; right:0;
    width:1px;
    background:rgba(255,255,255,0.12);
  }
  .now-playing-inner{ width:100%; max-width:360px; display:flex; flex-direction:column; gap:22px; }
  .art{
    width:100%;
    aspect-ratio:1/1;
    border-radius:18px;
    object-fit:cover;
    background:rgba(255,255,255,0.08);
    box-shadow:0 24px 50px rgba(0,0,0,0.4);
  }
  .title{
    font-family:var(--font-display);
    font-size:1.7rem;
    font-weight:500;
    margin:0 0 4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .artist{
    color:var(--muted);
    margin:0;
    font-size:1rem;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .bar-track{ height:3px;background:rgba(255,255,255,0.18);border-radius:2px;overflow:hidden; }
  .bar-fill{ height:100%;background:#FFFFFF;width:0%;transition:width .25s linear; }
  .times{ display:flex;justify-content:space-between;font-size:0.75rem;color:var(--muted);margin-top:6px; }
  .status-dot{ width:8px;height:8px;border-radius:50%;background:var(--line-dim);display:inline-block;margin-right:6px; }
  .status-dot.playing{ background:var(--accent);box-shadow:0 0 0 3px rgba(29,185,84,.25); }

  .lyrics-col{
    flex:1 1 50%;
    min-width:320px;
    height:100vh;
    overflow:hidden;
    position:relative;
    display:flex;
    align-items:center;
    padding:48px 64px;
    mask-image:linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
  }
  .lyrics-inner{
    width:100%;
    transition:transform .35s cubic-bezier(.22,.9,.3,1);
    will-change:transform;
  }
  .lyric-line{
    font-family:var(--font-display);
    font-size:1.6rem;
    line-height:1.85;
    color:rgba(255,255,255,0.4);
    transition:color .3s ease, transform .3s ease, font-size .3s ease;
    padding:4px 0;
  }
  .lyric-line.current{
    color:#FFFFFF;
    font-weight:500;
    font-size:1.85rem;
  }
  .lyrics-empty{
    color:var(--muted);
    font-family:var(--font-body);
    font-size:0.95rem;
    text-align:center;
    width:100%;
  }
  .footer-note{
    position:fixed; left:0; right:0; bottom:14px;
    text-align:center;color:rgba(255,255,255,0.35);font-size:0.78rem;
    z-index:6;
  }
  .footer-note a{ color:rgba(255,255,255,0.45); }

  @media (max-width:760px){
    .now-playing::after{ display:none; }
    .lyrics-col{ height:auto; min-height:50vh; padding:32px; mask-image:linear-gradient(to bottom, transparent, black 6%, black 94%, transparent); }
    .now-playing{ padding:32px; min-height:50vh; }
  }
</style>
</head>
<body>

<div class="bg-blur" id="bgBlur"></div>
<div class="bg-tint"></div>

<div class="login-wrap" id="loginWrap">
  <div class="login glass" id="loginScreen">
    <h1>Lo que suena, en letra</h1>
    <p>Conecta tu cuenta de Spotify para ver en vivo la canción que estás escuchando, con la letra sincronizada línea a línea.</p>
    <button id="loginBtn">Conectar con Spotify</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<div class="player" id="playerScreen">
  <div class="now-playing">
    <div class="now-playing-inner">
      <img class="art" id="art" src="" alt="">
      <div class="meta">
        <p class="title" id="trackTitle">—</p>
        <p class="artist"><span class="status-dot" id="statusDot"></span><span id="trackArtist">Esperando reproducción…</span></p>
      </div>
      <div>
        <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
        <div class="times"><span id="tCurrent">0:00</span><span id="tTotal">0:00</span></div>
      </div>
    </div>
  </div>

  <div class="lyrics-col">
    <div class="lyrics-inner" id="lyricsInner">
      <div class="lyrics-empty" id="lyricsEmpty">Reproduce algo en Spotify para ver la letra aquí.</div>
    </div>
  </div>
</div>

<div class="footer-note">Letras cortesía de <a href="https://lrclib.net" target="_blank" rel="noopener">lrclib.net</a></div>

<script>
/* ---------------- config ---------------- */
const CLIENT_ID = '6d795df80bd74f27a0fbc836646cf778';
// Se calcula sola a partir de dónde esté alojado este archivo.
// Debe coincidir EXACTAMENTE con el Redirect URI que registres en el Spotify Dashboard.
const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPES = 'user-read-currently-playing user-read-playback-state user-library-read playlist-read-private';

/* ---------------- PKCE helpers ---------------- */
function randomString(len){
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let out = '';
  const bytes = crypto.getRandomValues(new Uint8Array(len));
  for (let b of bytes) out += chars[b % chars.length];
  return out;
}
async function sha256(plain){
  const data = new TextEncoder().encode(plain);
  return crypto.subtle.digest('SHA-256', data);
}
function base64UrlEncode(buffer){
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

/* ---------------- auth flow ---------------- */
async function startLogin(){
  const verifier = randomString(64);
  localStorage.setItem('sp_verifier', verifier);
  const challenge = base64UrlEncode(await sha256(verifier));

  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: 'code',
    redirect_uri: REDIRECT_URI,
    code_challenge_method: 'S256',
    code_challenge: challenge,
    scope: SCOPES
  });
  window.location = 'https://accounts.spotify.com/authorize?' + params.toString();
}

async function exchangeCodeForToken(code){
  const verifier = localStorage.getItem('sp_verifier');
  const body = new URLSearchParams({
    client_id: CLIENT_ID,
    grant_type: 'authorization_code',
    code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: {'Content-Type':'application/x-www-form-urlencoded'},
    body
  });
  if(!res.ok) throw new Error('No se pudo canjear el código por un token.');
  return res.json();
}

async function refreshToken(){
  const refresh_token = localStorage.getItem('sp_refresh');
  if(!refresh_token) return false;
  const body = new URLSearchParams({
    client_id: CLIENT_ID,
    grant_type: 'refresh_token',
    refresh_token
  });
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: {'Content-Type':'application/x-www-form-urlencoded'},
    body
  });
  if(!res.ok) return false;
  const data = await res.json();
  saveTokens(data);
  return true;
}

function saveTokens(data){
  localStorage.setItem('sp_access', data.access_token);
  if(data.refresh_token) localStorage.setItem('sp_refresh', data.refresh_token);
  localStorage.setItem('sp_expires', Date.now() + (data.expires_in*1000));
}

async function ensureValidToken(){
  const expires = Number(localStorage.getItem('sp_expires') || 0);
  if(Date.now() > expires - 10000){
    const ok = await refreshToken();
    if(!ok) return null;
  }
  return localStorage.getItem('sp_access');
}

/* ---------------- lyrics (lrclib.net) ---------------- */
let lyricsCache = {}; // key: track|artist -> parsed lines
let currentLines = null;
let currentKey = null;

function parseLRC(lrc){
  const lines = [];
  const re = /\[(\d{2}):(\d{2})(?:\.(\d{2,3}))?\]/g;
  for(const raw of lrc.split('\n')){
    const matches = [...raw.matchAll(re)];
    if(matches.length === 0) continue;
    const text = raw.replace(re,'').trim();
    for(const m of matches){
      const min = parseInt(m[1],10);
      const sec = parseInt(m[2],10);
      const ms = m[3] ? parseInt(m[3].padEnd(3,'0'),10) : 0;
      const time = min*60000 + sec*1000 + ms;
      lines.push({time, text});
    }
  }
  lines.sort((a,b)=>a.time-b.time);
  return lines;
}

// When lrclib only has plain (unsynced) lyrics, spread the lines evenly
// across the track's duration so there's still a moving highlight.
function estimateTiming(plainText, durationMs){
  const rawLines = plainText.split('\n').filter(l => l.trim().length > 0);
  const n = rawLines.length;
  if(n === 0 || !durationMs) return rawLines.map(text => ({ time: 0, text }));
  return rawLines.map((text, i) => ({
    time: Math.round((i / n) * durationMs),
    text
  }));
}

async function fetchLyrics(track, artist, album, durationSec){
  const key = track+'|'+artist;
  if(lyricsCache[key]) return lyricsCache[key];
  try{
    const params = new URLSearchParams({
      track_name: track, artist_name: artist, album_name: album || '',
      duration: Math.round(durationSec || 0)
    });
    const res = await fetch('https://lrclib.net/api/get?'+params.toString());
    if(!res.ok) throw new Error('not found');
    const data = await res.json();
    let parsed = null;
    if(data.syncedLyrics){
      parsed = parseLRC(data.syncedLyrics);
    } else if(data.plainLyrics){
      parsed = estimateTiming(data.plainLyrics, (durationSec || 0) * 1000);
    }
    lyricsCache[key] = parsed;
    return parsed;
  }catch(e){
    lyricsCache[key] = null;
    return null;
  }
}

/* ---------------- lyrics rendering ---------------- */
const lyricsInner = document.getElementById('lyricsInner');
let activeIndex = -1;

function renderLyrics(lines){
  activeIndex = -1;
  if(!lines){
    lyricsInner.innerHTML = '<div class="lyrics-empty">No se encontró letra para esta canción.</div>';
    return;
  }
  lyricsInner.innerHTML = lines.map((l,i)=>
    `<div class="lyric-line" data-i="${i}">${l.text || '♪'}</div>`
  ).join('');
}

function highlightForTime(ms){
  if(!currentLines || currentLines.length === 0) return;
  let idx = -1;
  for(let i=0;i<currentLines.length;i++){
    if(currentLines[i].time <= ms) idx = i;
    else break;
  }
  if(idx === activeIndex) return;
  activeIndex = idx;
  const nodes = lyricsInner.querySelectorAll('.lyric-line');
  nodes.forEach(n=>n.classList.remove('current'));
  if(idx >= 0 && nodes[idx]){
    nodes[idx].classList.add('current');
    const panelHeight = document.querySelector('.lyrics-col').clientHeight;
    const offset = nodes[idx].offsetTop - panelHeight/2 + nodes[idx].offsetHeight/2;
    lyricsInner.style.transform = `translateY(${-offset}px)`;
  }
}

/* ---------------- player polling ---------------- */
const artEl = document.getElementById('art');
const bgBlur = document.getElementById('bgBlur');
const titleEl = document.getElementById('trackTitle');
const artistEl = document.getElementById('trackArtist');
const barFill = document.getElementById('barFill');
const tCurrent = document.getElementById('tCurrent');
const tTotal = document.getElementById('tTotal');
const statusDot = document.getElementById('statusDot');

let lastProgressMs = 0, lastDurationMs = 0, lastIsPlaying = false, lastFetchedAt = 0;
let lastArtwork = '';

function fmt(ms){
  if(!ms || ms < 0) ms = 0;
  const s = Math.floor(ms/1000);
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}

async function pollNowPlaying(){
  const token = await ensureValidToken();
  if(!token){ showLogin('Tu sesión expiró. Conéctate de nuevo.'); return; }

  try{
    const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
      headers: {'Authorization':'Bearer '+token}
    });
    if(res.status === 204){
      titleEl.textContent = '—';
      artistEl.textContent = 'Nada sonando ahora mismo';
      statusDot.classList.remove('playing');
      return;
    }
    if(!res.ok) return;
    const data = await res.json();
    if(!data || !data.item) return;

    const track = data.item.name;
    const artist = data.item.artists.map(a=>a.name).join(', ');
    const album = data.item.album ? data.item.album.name : '';
    const artwork = data.item.album && data.item.album.images[0] ? data.item.album.images[0].url : '';
    const durationMs = data.item.duration_ms;
    const progressMs = data.progress_ms || 0;
    const isPlaying = data.is_playing;

    titleEl.textContent = track;
    artistEl.textContent = artist;
    if(artwork && artwork !== lastArtwork){
      artEl.src = artwork;
      bgBlur.style.backgroundImage = `url("${artwork}")`;
      lastArtwork = artwork;
    }
    tTotal.textContent = fmt(durationMs);
    statusDot.classList.toggle('playing', isPlaying);

    lastProgressMs = progressMs;
    lastDurationMs = durationMs;
    lastIsPlaying = isPlaying;
    lastFetchedAt = Date.now();

    const key = track+'|'+artist;
    if(key !== currentKey){
      currentKey = key;
      renderLyrics(null);
      const lines = await fetchLyrics(track, artist, album, durationMs/1000);
      currentLines = lines;
      renderLyrics(lines);
    }
  }catch(e){
    // silent retry on next poll
  }
}

function tick(){
  let ms = lastProgressMs;
  if(lastIsPlaying) ms += (Date.now() - lastFetchedAt);
  ms = Math.min(ms, lastDurationMs || ms);
  tCurrent.textContent = fmt(ms);
  if(lastDurationMs) barFill.style.width = (ms/lastDurationMs*100)+'%';
  highlightForTime(ms);
}

/* ---------------- screen management ---------------- */
function showLogin(err){
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('playerScreen').classList.remove('active');
  if(err) document.getElementById('loginError').textContent = err;
}
function showPlayer(){
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('playerScreen').classList.add('active');
  pollNowPlaying();
  setInterval(pollNowPlaying, 3000);
  setInterval(tick, 250);
}

document.getElementById('loginBtn').addEventListener('click', startLogin);

/* ---------------- boot ---------------- */
(async function boot(){
  const url = new URL(window.location.href);
  const code = url.searchParams.get('code');
  const err = url.searchParams.get('error');

  if(err){ showLogin('Spotify denegó el acceso: '+err); return; }

  if(code){
    try{
      const data = await exchangeCodeForToken(code);
      saveTokens(data);
      window.history.replaceState({}, '', REDIRECT_URI.replace(/^https?:\/\/[^/]+/,'') || '/');
      showPlayer();
    }catch(e){
      showLogin('Error autenticando con Spotify. Intenta de nuevo.');
    }
    return;
  }

  const token = localStorage.getItem('sp_access');
  if(token){
    const valid = await ensureValidToken();
    if(valid){ showPlayer(); return; }
  }
  showLogin();
})();
</script>
</body>
</html>
